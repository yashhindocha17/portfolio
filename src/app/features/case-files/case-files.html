<section class="cases-section">
  <app-section-head tag="02" title="case_files — selected projects"></app-section-head>

  <div class="cases">
    @for (project of projects(); track project.id) {
      <div class="case">
        <span class="stamp" [class.deployed]="project.status === 'deployed'" [class.research]="project.status === 'research'">
          {{ project.status }}
        </span>
        <span class="case-id">{{ project.caseId }}</span>
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p> 
      </div>
    } @empty {
      <p>No projects returned.</p>
    }
  </div>
</section>
